name: StudyPod Quality

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Reject tracked environment files
        shell: bash
        run: |
          if [[ -n "$(git ls-files -- ':(glob)**/.env*' ':(exclude,glob)**/.env.example')" ]]; then
            echo "Keep deployment environment files outside Git."
            exit 1
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install and test the MCP server
        working-directory: mcp-server
        run: |
          npm ci
          node --test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint frontend and backend
        run: npm run lint

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Install browser acceptance runtime
        run: npx playwright install --with-deps chromium

      - name: Acceptance gate decision and audio contracts
        run: npm run test:gate:unit

      - name: Enforce coverage for passage matching
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=hacksgiving/passage-finder/match.mjs
          --test-coverage-lines=100 --test-coverage-branches=85 --test-coverage-functions=100
          hacksgiving/passage-finder/match.test.mjs

      - name: Enforce coverage for passage hosting and source links
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=hacksgiving/passage-finder/server.mjs
          --test-coverage-lines=95 --test-coverage-branches=70 --test-coverage-functions=100
          hacksgiving/passage-finder/server.test.mjs

      - name: Enforce coverage for audiobook render admission and cancellation
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=backend/src/services/audiobookRenderAdmission.js
          --test-coverage-lines=100 --test-coverage-branches=90 --test-coverage-functions=100
          backend/src/__tests__/audiobookRenderAdmission.test.js

      - name: Podcast completion command acceptance
        run: npx vitest run --config vitest.config.ts src/__tests__/integration/podcastChatCommands.test.tsx

      - name: Production build
        run: npm run build

      - name: Built-app desktop and mobile acceptance gate
        run: npm run test:e2e

      - name: Real isolated authenticated desktop and mobile gate
        id: auth_local
        run: npm run test:auth:local

      - name: Preserve sanitized authenticated receipts
        if: always() && (steps.auth_local.outcome == 'success' || steps.auth_local.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          include-hidden-files: true
          name: studypod-auth-gate
          path: |
            .ai-bridge/studypod-renewal-20261012/release-gate/auth-local/*/desktop/report.json
            .ai-bridge/studypod-renewal-20261012/release-gate/auth-local/*/mobile/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studypod-browser-gate
          path: .ai-bridge/studypod-browser-gate/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce bundle budgets
        run: npm run check:bundle

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

      - name: Reject committed local artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '^(\.ai-bridge/qa-artifacts|\.playwright-(cli|mcp)/|uploads/|scratch/qa-sources/)'; then
            echo "Local QA or upload artifacts must not be committed."
            exit 1
          fi
