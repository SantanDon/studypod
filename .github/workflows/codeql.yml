name: CodeQL

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
